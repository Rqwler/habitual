name: habit-tracker-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: habittracker
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit
    ports:
      - "5432:5432"
    volumes:
      - habit_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit -d habittracker"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    profiles: ["app"]
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/habittracker
      SPRING_DATASOURCE_USERNAME: habit
      SPRING_DATASOURCE_PASSWORD: habit
      JWT_SECRET: local-development-only-secret-please-change-1234567890
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
    ports:
      - "8080:8080"

volumes:
  habit_pgdata_dev: