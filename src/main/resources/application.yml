spring:
  application:
    name: habit-tracker
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h
          cache-public: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
  error:
    include-message: never
    include-stacktrace: never

app:
  timezone: ${APP_TIMEZONE:UTC}
  jwt:
    # Development fallback only. Production requires JWT_SECRET (see application-prod.yml).
    secret: ${JWT_SECRET:local-development-only-secret-please-change-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.habittracker: INFO